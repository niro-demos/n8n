name: Niro Fix (claude)

on:
  workflow_dispatch:
    inputs:
      auth_check_only:
        description: Test GitHub App publishing without running Niro
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: niro-fix-claude-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auth-check:
    if: ${{ inputs.auth_check_only }}
    name: Check Niro GitHub App publishing
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint control token with the official action
        id: control-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.NIRO_APP_CLIENT_ID }}
          private-key: ${{ secrets.NIRO_APP_PRIVATE_KEY }}
          owner: niro-demos
          repositories: n8n

      - name: Test control token repository writes
        shell: bash
        env:
          GH_TOKEN: ${{ steps.control-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api /installation/repositories --paginate \
            --jq '.repositories[].full_name' | grep -Fx "$GITHUB_REPOSITORY"

          branch="niro-auth-control-${GITHUB_RUN_ID}"
          cleanup() {
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          base_sha="$(git rev-parse "origin/${{ github.event.repository.default_branch }}")"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${branch}" -f sha="$base_sha" --silent
          cleanup
          trap - EXIT

      - name: Install the Niro version from the failed run
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/apxlabs-ai/niro/main/install.sh | NIRO_VERSION=v0.1.61 sh

      - name: Test Niro-minted token and exact git credential path
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          NIRO_APP_CLIENT_ID: ${{ secrets.NIRO_APP_CLIENT_ID }}
          NIRO_APP_PRIVATE_KEY: ${{ secrets.NIRO_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          token="$(niro git token -C "$GITHUB_WORKSPACE")"
          echo "::add-mask::$token"
          GH_TOKEN="$token" gh api /installation/repositories --paginate \
            --jq '.repositories[].full_name' | grep -Fx "$GITHUB_REPOSITORY"
          unset token

          git config --local --unset-all credential.helper || true
          git config --local --add credential.helper ""
          git config --local --add credential.helper "!$(command -v niro) git credential"
          git config --local credential.useHttpPath true

          branch="niro-auth-niro-${GITHUB_RUN_ID}"
          cleanup() {
            git push origin --delete "$branch" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          base_sha="$(git rev-parse "origin/${{ github.event.repository.default_branch }}")"
          git push origin "${base_sha}:refs/heads/${branch}"
          cleanup
          trap - EXIT

  fix:
    if: ${{ !inputs.auth_check_only }}
    name: Pentest and open fix PRs
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Niro pushes and opens PRs with a fresh GitHub App token, so the
          # checkout must not leave its own credential behind for git to use.
          persist-credentials: false

      - name: Install approved Niro configuration
        uses: niro-demos/niro-configs/.github/actions/install@8c1cc4a6a127684d1395740a74faa5f9128d3a08
        with:
          repository: ${{ github.repository }}
          niro-dir: niro
          install-root: ${{ github.workspace }}

      - name: Install Niro
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/apxlabs-ai/niro/main/install.sh | sh

      - name: Verify Niro config proposal credentials
        shell: bash
        env:
          NIRO_APP_CLIENT_ID: ${{ secrets.NIRO_APP_CLIENT_ID }}
          NIRO_APP_PRIVATE_KEY: ${{ secrets.NIRO_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$NIRO_APP_CLIENT_ID" ] || [ -z "$NIRO_APP_PRIVATE_KEY" ]; then
            echo "::error::NIRO_APP_CLIENT_ID and NIRO_APP_PRIVATE_KEY are required"
            exit 1
          fi

      # Codex/Copilot setup and other CI settings:
      # https://github.com/apxlabs-ai/niro/blob/main/docs/ci-environment.md
      - name: Run Niro
        shell: bash
        env:
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
          NIRO_APP_CLIENT_ID: ${{ secrets.NIRO_APP_CLIENT_ID }}
          NIRO_APP_PRIVATE_KEY: ${{ secrets.NIRO_APP_PRIVATE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COPILOT_PROVIDER_API_KEY: ${{ secrets.COPILOT_PROVIDER_API_KEY }}
          COPILOT_PROVIDER_BASE_URL: https://openrouter.ai/api/v1
          COPILOT_PROVIDER_TYPE: openai
          COPILOT_MODEL: z-ai/glm-5.2
        run: niro fix --autonomous --agent=claude --goal="Pentest this application" --config-dir=niro --generate-report --include-findings=true --upload-debug-logs=true

      - name: Create Niro config catalog token
        id: niro-configs-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.NIRO_APP_CLIENT_ID }}
          private-key: ${{ secrets.NIRO_APP_PRIVATE_KEY }}
          owner: niro-demos
          repositories: niro-configs

      - name: Propose Niro configuration update
        uses: niro-demos/niro-configs/.github/actions/propose@5e67fd8f39949c992af0abcd6efebb1a685353cf
        with:
          catalog-token: ${{ steps.niro-configs-token.outputs.token }}
          source-token: ${{ github.token }}
          archive: ${{ github.workspace }}/niro-knowledge.tar
          repository: ${{ github.repository }}
          niro-dir: niro
          source-sha: ${{ github.sha }}
          source-run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload Niro knowledge
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: niro-knowledge
          path: niro-knowledge.tar
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Niro penetration-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: niro-pentest-report
          path: ${{ runner.temp }}/niro-reports/**/penetration-test-report-*.pdf
          if-no-files-found: ignore
          retention-days: 30

      # Uploads only when the run wrote the tar — enabled explicitly above.
      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: niro-debug-logs-unsafe
          path: niro-debug-logs.tar
          if-no-files-found: ignore
          retention-days: 7
